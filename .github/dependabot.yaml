version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      flake-inputs:
        patterns:
          - "*"
        # goda-vim also needs go.mod updated, so its update fails CI until then.
        exclude-patterns:
          - goda-vim
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      major:
        patterns:
          - "*"
        update-types:
          - major
